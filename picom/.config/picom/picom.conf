# Backend & Performance
backend = "glx";
vsync = true;
glx-no-stencil = true;
glx-copy-from-front = false;

# Fading (Essential for "smooth" sliding)
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 5;

# Opacity & Blur
inactive-opacity = 0.85;
frame-opacity = 1.0;
inactive-opacity-override = false;
blur-background = true;
blur-method = "dual_kawase";
blur-strength = 5;

# Corner Radius (Looks great with AwesomeWM)
corner-radius = 12;

# Shadows
shadow = true;
shadow-radius = 12;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-opacity = 0.5;

# Window type settings
wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.75; focus = true; full-shadow = false; };
  dock = { shadow = false; clip-shadow-above = true; }
  dnd = { shadow = false; }
  popup_menu = { opacity = 0.8; }
  dropdown_menu = { opacity = 0.8; }
};
